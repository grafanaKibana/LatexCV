name: Generate cover letter

on:
  workflow_dispatch:
    inputs:
      text:
        description: Full cover letter (plain text, including greeting and closing)
        required: true
        type: string

permissions:
  contents: read

jobs:
  coverletter:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Prepare cover letter
      env:
        COVER_LETTER_TEXT: ${{ inputs.text }}
      run: printf '%s' "$COVER_LETTER_TEXT" | python3 scripts/prepare-coverletter.py

    - name: Compile PDF
      run: ./build.sh compiled/coverletter.tex

    - name: Upload cover letter
      uses: actions/upload-artifact@v6
      with:
        name: coverletter-pdf
        path: compiled/coverletter.pdf
        if-no-files-found: error
