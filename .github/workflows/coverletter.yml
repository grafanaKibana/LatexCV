name: Generate cover letter (sections)

on:
  workflow_dispatch:
    inputs:
      company:
        description: Company name (used in the Why section heading)
        required: true
        type: string
      intro:
        description: Optional introduction after Hi and before About Me
        required: false
        default: ''
        type: string
      about_me:
        description: About Me — your background and relevant experience
        required: true
        type: string
      why_company:
        description: Why this company — your motivation for joining
        required: true
        type: string
      why_me:
        description: Why Me — what you bring to the role
        required: true
        type: string

permissions:
  contents: read

jobs:
  coverletter:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Prepare cover letter
      env:
        COMPANY: ${{ inputs.company }}
        INTRO: ${{ inputs.intro }}
        ABOUT_ME: ${{ inputs.about_me }}
        WHY_COMPANY: ${{ inputs.why_company }}
        WHY_ME: ${{ inputs.why_me }}
      run: |
        python3 scripts/prepare-coverletter.py \
          --company="$COMPANY" \
          --intro="$INTRO" \
          --about-me="$ABOUT_ME" \
          --why-company="$WHY_COMPANY" \
          --why-me="$WHY_ME"

    - name: Compile PDF
      run: ./build.sh compiled/coverletter.tex

    - name: Upload cover letter
      uses: actions/upload-artifact@v6
      with:
        name: coverletter-pdf
        path: compiled/coverletter.pdf
        if-no-files-found: error
