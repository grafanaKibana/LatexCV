name: Compile PDFs

on:
  push: {}
  pull_request: {}

permissions:
  contents: write

jobs:
  changes:
    # Only needed to gate the release job, which runs on pushes to master.
    # On push, paths-filter diffs with git and needs no pull-requests scope,
    # which this workflow's contents-only token would otherwise withhold.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    outputs:
      latex: ${{ steps.filter.outputs.latex }}

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Detect LaTeX content changes
      id: filter
      uses: dorny/paths-filter@v3
      with:
        filters: |
          latex:
          - 'latex/**'
          - 'awesome-cv.cls'

  build:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7

    - name: Install build tools
      run: |
        apt update
        apt install --yes curl unzip

    - name: Compile
      run: ./build.sh

    - uses: actions/upload-artifact@v6
      with:
        name: cv-pdf
        path: compiled/cv.pdf

    - uses: actions/upload-artifact@v6
      with:
        name: resume-pdf
        path: compiled/resume.pdf

    - uses: actions/upload-artifact@v6
      with:
        name: coverletter-pdf
        path: compiled/coverletter.pdf

    - uses: actions/upload-artifact@v6
      with:
        name: compiled
        path: compiled/*.pdf

  release:
    needs:
    - build
    - changes
    # Only publish a release when the LaTeX content changes land on master.
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/master'
      && needs.changes.outputs.latex == 'true'
    runs-on: ubuntu-latest

    # Serialize releases so overlapping pushes to master cannot read the same
    # iteration and race to the same CVBuild-<year>.<iteration> tag. Queued runs
    # wait (never cancelled) so every merge still gets its own sequential release.
    concurrency:
      group: release-master
      cancel-in-progress: false

    steps:
    - name: Download compiled PDFs
      uses: actions/download-artifact@v6
      with:
        name: compiled
        path: release-files

    - name: Compute release name
      id: build
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        year="$(date +'%Y')"
        # JetBrains-style versioning: CVBuild <year>.<iteration>, where the
        # iteration is bumped per release and resets when the year rolls over.
        iteration="$(gh release list \
          --repo "${{ github.repository }}" \
          --limit 1000 \
          --json tagName \
          --jq "[.[] | .tagName | select(startswith(\"CVBuild-${year}.\")) | ltrimstr(\"CVBuild-${year}.\") | tonumber] | max // 0")"
        iteration="$((iteration + 1))"
        echo "tag=CVBuild-${year}.${iteration}" >> "$GITHUB_OUTPUT"
        echo "name=CVBuild ${year}.${iteration}" >> "$GITHUB_OUTPUT"

    - name: Publish release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.build.outputs.tag }}
        name: ${{ steps.build.outputs.name }}
        body: |
          Automatically generated from ${{ github.sha }}.

          Download the latest documents:

          | Document | Résumé | CV | Cover Letter |
          | --- | --- | --- | --- |
          | Download | [resume.pdf](https://github.com/${{ github.repository }}/releases/latest/download/resume.pdf) | [cv.pdf](https://github.com/${{ github.repository }}/releases/latest/download/cv.pdf) | [coverletter.pdf](https://github.com/${{ github.repository }}/releases/latest/download/coverletter.pdf) |
        files: release-files/*.pdf
