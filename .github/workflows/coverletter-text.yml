name: Generate cover letter (paste text)

on:
  workflow_dispatch:
    inputs:
      company:
        description: Company name (used in the PDF filename)
        required: true
        type: string
      text:
        description: Full letter (plain text, including greeting and closing)
        required: true
        type: string

permissions:
  contents: read

jobs:
  coverletter:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Prepare cover letter
      env:
        COVER_LETTER_TEXT: ${{ inputs.text }}
      run: printf '%s' "$COVER_LETTER_TEXT" | python3 scripts/prepare-coverletter.py

    - name: Compile PDF
      run: ./build.sh compiled/coverletter.tex

    - name: Name PDF for company
      id: filename
      env:
        COMPANY: ${{ inputs.company }}
      run: python3 scripts/name-coverletter.py

    - name: Upload cover letter
      uses: actions/upload-artifact@v6
      with:
        name: ${{ steps.filename.outputs.stem }}
        path: compiled/${{ steps.filename.outputs.stem }}.pdf
        if-no-files-found: error
